# probe-github-notes built from this checkout, for the workflows of e2e.
# Probe resolves an action before the first job starts, so the executable is
# built before probe runs:
#
#   go build -o e2e/action/probe-github-notes . && probe e2e/workflow.yml
name: github-notes
description: Put the notes of a run on GitHub, in a pull request comment, the job summary or an issue
guard: [read-only, allow-host]
params: [to, notes, body, token, repository, number, title, labels, key, api_url, timeout]
runs:
  using: binary
  path: probe-github-notes
